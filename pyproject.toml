[project]
name = "felixo-game-launcher"
version = "0.0.0"
description = "Launcher open source que reúne os jogos instalados no computador, de qualquer loja ou launcher."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.19",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
