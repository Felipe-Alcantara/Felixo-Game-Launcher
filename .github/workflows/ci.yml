name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: qualidade (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m scripts.qualidade.verificar_links
